{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ area_title }} | {{ shop_name }}</title>
<link rel="icon" href="{% static 'core/favicon.ico' %}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'core/icons/icon-32.png' %}">
<link rel="apple-touch-icon" href="{% static 'core/apple-touch-icon.png' %}">
<link rel="stylesheet" href="{% static 'core/theme.css' %}?v=6">
<script src="{% static 'core/theme.js' %}"></script>
<link rel="stylesheet" href="{% static 'core/posloader.css' %}">
<script src="{% static 'core/posloader.js' %}"></script>
<style>
  /* Till picker shown on every step after the supervisor step */
  main.auth .tillpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  main.auth .tillpick button,main.auth .tillpick button.ghost{margin:0;width:auto;flex:1;padding:11px 10px}
  main.auth .tillpick button[aria-pressed="true"]{cursor:default}
  main.auth .tillpick button.ghost{color:var(--text)}
</style>
</head>
<body class="auth">
<main class="auth">
  <button type="button" class="theme-toggle floating" data-theme-toggle aria-label="Switch to light mode" title="Switch to light mode"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg></button>
  <div class="auth-logo"><img src="{% static 'core/logo-mark.png' %}" alt=""><span class="brand-text"><b>WINE</b> <i>POS</i></span></div>
  <h1>{{ area_title }}</h1>
  <p class="shop">{{ shop_name }}</p>

  <!-- POS step 1 when required: supervisor authorization -->
  <form id="f-authorize" hidden autocomplete="off">
    <p class="step">Step 1 of 3: Supervisor authorization</p>
    <label for="a-till">Till</label>
    <select id="a-till"></select>
    <label for="a-user">Supervisor / manager username</label>
    <input id="a-user" autocomplete="off">
    <label for="a-secret">Password or PIN</label>
    <input id="a-secret" type="password" autocomplete="off">
    <button type="submit">Authorize POS</button>
    <div class="msg" id="m-authorize" role="alert"></div>
    <p class="hint"> </p>
  </form>

  <!-- POS step 2: cashier login -->
  <form id="f-cashier" hidden autocomplete="off">
    <p class="step" id="cashier-step-label">Step 2 of 3: Cashier login</p>
    <p class="hint" id="authorized-note"></p>
    <label>Till</label>
    <div class="tillpick" data-tillpick data-msg="m-cashier" role="group" aria-label="Choose till"></div>
    <label for="c-user">Cashier username</label>
    <input id="c-user" autocomplete="off">
    <label for="c-secret">Password or PIN</label>
    <input id="c-secret" type="password" autocomplete="off">
    <button type="submit">Log in</button>
    <button type="button" class="ghost" id="b-back-authorize">Back to supervisor authorization</button>
    <div class="msg" id="m-cashier" role="alert"></div>
  </form>

  <!-- POS step 3: shift -->
  <form id="f-shift" hidden autocomplete="off">
    <p class="step" id="shift-step-label">Step 3 of 3: Open your shift</p>
    <p class="hint" id="shift-note"></p>
    <label>Till</label>
    <div class="tillpick" data-tillpick data-msg="m-shift" role="group" aria-label="Choose till"></div>
    <label for="s-float">Opening cash float (KES)</label>
    <input id="s-float" inputmode="decimal" autocomplete="off">
    <button type="submit">Open shift</button>
    <button type="button" class="ghost" id="b-back-cashier">Choose a different cashier</button>
    <button type="button" class="ghost" id="b-change-authorizer">Change supervisor or till</button>
    <div class="msg" id="m-shift" role="alert"></div>
  </form>

  <!-- POS ready -->
  <section id="s-ready" hidden>
    <p class="step">Till <span id="r-till"></span> is ready</p>
    <p id="r-who"></p>
    <p class="hint">Opening the sales screen...</p>
    <a href="/pos/sell/">Open the sales screen</a>
    <button class="ghost" id="b-logout-pos" type="button">Log out</button>
  </section>

  <!-- Manager / receiving login -->
  <form id="f-login" hidden autocomplete="off">
    <label for="l-user">Username</label>
    <input id="l-user" autocomplete="off">
    <label for="l-secret">Password or PIN</label>
    <input id="l-secret" type="password" autocomplete="off">
    <button type="submit">Log in</button>
    <div class="msg" id="m-login" role="alert"></div>
  </form>

  <section id="s-home" hidden>
    <p class="step" id="h-who"></p>
    <p class="hint" id="h-note"></p>
    <ul id="h-perms"></ul>
    <button id="b-admin" type="button" hidden>Open management screens</button>
    <button class="ghost" id="b-logout" type="button">Log out</button>
  </section>
</main>

<script>
(function () {
  var MODE = "{{ mode }}";
  var $ = function (id) { return document.getElementById(id); };
  var current = null, tills = [], authBy = "", cashierLoginWithoutSupervisor = false, lockedTillNo = null;
  var show = function (id) {
    current = id;
    ["f-authorize","f-cashier","f-shift","s-ready","f-login","s-home"].forEach(function (x) { $(x).hidden = (x !== id); });
    $("b-back-authorize").hidden = id === "f-cashier" && (cashierLoginWithoutSupervisor || lockedTillNo !== null);
    $("b-change-authorizer").hidden = cashierLoginWithoutSupervisor;
    if (typeof renderPicks === "function") renderPicks();
    var first = $(id).querySelector("input:not([type=hidden]), select");
    if (first) first.focus();
  };
  var csrf = function () {
    var m = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : "";
  };
  function api(method, url, body) {
    var opts = { method: method, credentials: "same-origin", headers: { "X-CSRFToken": csrf() } };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(url, opts).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "Unexpected server response." }; });
    }).catch(function () { return { ok: false, error: "Cannot reach the shop server." }; });
  }
  function say(id, text, ok) { var el = $(id); el.textContent = text || ""; el.className = "msg" + (ok ? " ok" : ""); }
  function submit(formId, msgId, handler) {
    $(formId).addEventListener("submit", function (e) {
      e.preventDefault(); say(msgId, "");
      handler().then(function (res) { if (!res.ok) say(msgId, res.error || "Something went wrong."); });
    });
  }
  function logout() { api("POST", "/api/auth/logout/", {}).then(function () { location.reload(); }); }

  if (MODE === "pos") {
    var tillNo = null;
    var requestedTill = new URLSearchParams(location.search).get("till");
    var stateUrl = "/api/pos/state/" + (requestedTill ? "?till=" + encodeURIComponent(requestedTill) : "");
    PosLoader.show("Getting the till ready");
    api("GET", stateUrl).then(function (s) {
      tills = s.tills || [];
      cashierLoginWithoutSupervisor = s.cashier_login_without_supervisor === true;
      if (s.till) tillNo = Number(s.till);
      if (s.locked_shift) {
        lockedTillNo = Number(s.locked_shift.till);
        tillNo = lockedTillNo;
        $("authorized-note").textContent = "Sign in as " + s.locked_shift.cashier +
          " to resume this locked till. Supervisor authorization is not required.";
      }
      if (cashierLoginWithoutSupervisor && lockedTillNo === null) {
        $("cashier-step-label").textContent = "Step 1 of 2: Cashier login";
        $("shift-step-label").textContent = "Step 2 of 2: Open your shift";
        $("authorized-note").textContent = "Sign in with your cashier account. Supervisor authorization is disabled by the manager.";
      }
      var sel = $("a-till");
      (s.tills || []).forEach(function (t) {
        var o = document.createElement("option"); o.value = t.number; o.textContent = t.name; sel.appendChild(o);
      });
      if (requestedTill) { sel.value = requestedTill; tillNo = Number(requestedTill); }
      else if (tillNo) { sel.value = tillNo; }
      else if (tills.length) { tillNo = tills[0].number; }
      return api("GET", "/api/auth/me/");
    }).then(function (me) {
      if (me.user) { return api("GET", "/api/pos/shift/").then(function (s) {
        if (s.ok && s.shift) { tillNo = s.till; return ready(me.user, s.till, s.shift); }
        if (s.ok && !s.till_busy_with) { tillNo = s.till; return needShift(); }
        if (s.ok && s.till_busy_with) {
          tillNo = s.till; $("a-till").value = s.till;
          return api("POST", "/api/auth/logout/", {}).then(function () {
            if (lockedTillNo !== null) {
              show("f-cashier");
            } else if (cashierLoginWithoutSupervisor) {
              show("f-cashier");
              say("m-cashier", "There is an open shift for " + s.till_busy_with + ". Choose another till.");
            } else {
              show("f-authorize");
              say("m-authorize", "There is an open shift for " + s.till_busy_with + ". A supervisor can authorize this till; its cashier must sign in to continue.");
            }
          });
        }
        return api("POST", "/api/auth/logout/", {}).then(function () {
          show(cashierLoginWithoutSupervisor ? "f-cashier" : "f-authorize");
        });
      }); }
      if (lockedTillNo !== null) {
        show("f-cashier");
      } else if (cashierLoginWithoutSupervisor) {
        show("f-cashier");
      } else {
        show("f-authorize");
      }
    }).then(function () { PosLoader.hide(); }, function () { PosLoader.hide(); });
    submit("f-authorize", "m-authorize", function () {
      return api("POST", "/api/pos/authorize/", {
        till: $("a-till").value,
        username: $("a-user").value, secret: $("a-secret").value
      })
        .then(function (r) {
          $("a-secret").value = ""; $("a-user").value = "";
          if (r.ok) {
            tillNo = r.till; authBy = r.authorized_by; $("c-user").value = "";
            $("authorized-note").textContent = tillName(r.till) + " authorized by " + r.authorized_by +
              ". Any active cashier may sign in.";
            show("f-cashier");
          }
          return r;
        });
    });
    $("b-back-authorize").addEventListener("click", function () {
      api("POST", "/api/pos/authorization/cancel/", {}).then(function (r) {
        if (!r.ok) { say("m-cashier", r.error || "Could not return to supervisor authorization."); return; }
        tillNo = null; $("c-user").value = ""; $("c-secret").value = "";
        show("f-authorize");
      });
    });
    submit("f-cashier", "m-cashier", function () {
      if (lockedTillNo !== null) {
        return api("POST", "/api/pos/unlock/", {
          till: lockedTillNo, username: $("c-user").value, secret: $("c-secret").value
        }).then(function (r) {
          $("c-secret").value = "";
          if (r.ok) { lockedTillNo = null; tillNo = r.till; ready(r.user, r.till, r.shift); }
          return r;
        });
      }
      return api("POST", "/api/pos/cashier-login/", { username: $("c-user").value, secret: $("c-secret").value, till: tillNo })
        .then(function (r) {
          $("c-secret").value = "";
          if (!r.ok) return r;
          tillNo = r.till;
          if (r.till_busy_with) { say("m-cashier", tillName(r.till) + " already has an open shift for " + r.till_busy_with + ". Switch to another till above."); renderPicks(); return { ok: true }; }
          r.shift ? ready(r.user, r.till, r.shift) : needShift();
          return r;
        });
    });
    $("b-back-cashier").addEventListener("click", function () {
      api("POST", "/api/pos/cashier/change/", {}).then(function (r) {
        if (!r.ok) { say("m-shift", r.error || "Could not change cashier."); return; }
        $("c-user").value = ""; $("c-secret").value = "";
        $("a-till").value = r.till; say("m-cashier", "");
        show("f-authorize");
        say("m-authorize", "A supervisor must authorize this till before the next cashier can sign in.", true);
      });
    });
    $("b-change-authorizer").addEventListener("click", function () {
      api("POST", "/api/pos/authorization/cancel/", {}).then(function (r) {
        if (!r.ok) { say("m-shift", r.error || "Could not change supervisor authorization."); return; }
        tillNo = null; $("c-user").value = ""; $("c-secret").value = "";
        show("f-authorize");
      });
    });
    submit("f-shift", "m-shift", function () {
      return api("POST", "/api/pos/shift/open/", { opening_float: $("s-float").value }).then(function (r) {
        if (r.ok) { api("GET", "/api/auth/me/").then(function (me) { ready(me.user, tillNo, r.shift); }); }
        return r;
      });
    });
    $("b-logout-pos").addEventListener("click", logout);
    function tillName(n) {
      for (var i = 0; i < tills.length; i++) { if (String(tills[i].number) === String(n)) return tills[i].name; }
      return "till " + n;
    }
    // Till buttons on the cashier and shift steps: the selected till stays highlighted.
    function renderPicks() {
      Array.prototype.forEach.call(document.querySelectorAll("[data-tillpick]"), function (box) {
        box.innerHTML = "";
        var choices = lockedTillNo === null ? tills : tills.filter(function (t) { return t.number === lockedTillNo; });
        choices.forEach(function (t) {
          var b = document.createElement("button"), cur = String(t.number) === String(tillNo);
          b.type = "button"; b.textContent = t.name; b.setAttribute("aria-pressed", cur ? "true" : "false");
          if (!cur) { b.className = "ghost"; b.addEventListener("click", function () {
            if (cashierLoginWithoutSupervisor) {
              tillNo = t.number; say(box.getAttribute("data-msg"), ""); renderPicks(); return;
            }
            switchTill(t.number, box.getAttribute("data-msg"));
          }); }
          box.appendChild(b);
        });
      });
    }
    function switchTill(n, msgId) {
      say(msgId, "");
      return api("POST", "/api/pos/till/change/", { till: n }).then(function (r) {
        if (!r.ok) { say(msgId, r.error || "Could not change the till."); return; }
        tillNo = r.till;
        if (r.reauthorize) {
          $("a-till").value = r.till; $("c-user").value = ""; $("c-secret").value = "";
          show("f-authorize"); say("m-authorize", "Now on " + r.till_name + ". The supervisor must authorize it.", true);
          return;
        }
        $("authorized-note").textContent = (authBy ? "Authorized by " + authBy + " for " : "Now on ") + r.till_name + ".";
        if (r.till_busy_with) { say(msgId, r.till_name + " already has an open shift for " + r.till_busy_with + ". Choose another till."); renderPicks(); return; }
        api("GET", "/api/auth/me/").then(function (me) {
          if (me.user && r.shift) { ready(me.user, r.till, r.shift); return; }
          if (me.user) { needShift(); say("m-shift", "Switched to " + r.till_name + ".", true); return; }
          renderPicks(); say("m-cashier", "Switched to " + r.till_name + ".", true);
        });
      });
    }
    function needShift() { $("shift-note").textContent = "No open shift on this till yet."; show("f-shift"); }
    function ready(user, till, shift) {
      $("r-till").textContent = till; $("r-who").textContent = "Cashier: " + user.name + " | Float: " + shift.opening_float;
      show("s-ready");
      PosLoader.show("Opening till " + till, "Loading the sales screen");   // stays up until the next page appears
      location.replace("/pos/sell/");
    }
  } else {
    var NEEDS = { manager: "Manager area", receiving: "Stock receiving" };
    function home(user) {
      if (MODE === "manager") { PosLoader.show("Opening manager", "Loading the management screens"); location.replace("/manage/"); return; }
      if (MODE === "receiving") { PosLoader.show("Opening receiving", "Loading stock receiving"); location.replace("/manage/receiving/"); return; }
      $("h-who").textContent = "Signed in: " + user.name + (user.role ? " (" + user.role + ")" : "");
      $("h-note").textContent = NEEDS[MODE] + ". The full screens arrive in later phases. Your access:";
      var ul = $("h-perms"); ul.innerHTML = "";
      user.permissions.forEach(function (p) { var li = document.createElement("li"); li.textContent = p; ul.appendChild(li); });
      $("b-admin").hidden = !(user.is_manager && MODE === "manager");
      show("s-home");
    }
    PosLoader.show(MODE === "manager" ? "Starting manager" : "Starting receiving", "Checking sign-in");
    api("GET", "/api/auth/me/").then(function (me) { if (me.user) home(me.user); else show("f-login"); })
      .then(function () { PosLoader.hide(); }, function () { PosLoader.hide(); });
    submit("f-login", "m-login", function () {
      return api("POST", "/api/auth/login/", { area: MODE, username: $("l-user").value, secret: $("l-secret").value })
        .then(function (r) { $("l-secret").value = ""; if (r.ok) home(r.user); return r; });
    });
    $("b-admin").addEventListener("click", function () { location.href = "/admin/"; });
    $("b-logout").addEventListener("click", logout);
  }
})();
</script>
</body>
</html>
